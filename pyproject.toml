[build-system]
# license = "Apache-2.0" and license-files are PEP 639, which needs setuptools>=77.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ecmwf-vault"
description = "Read one ECMWF Vault secret and keep it off disk"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
version = "0.3.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
]
urls.Homepage = "https://github.com/ecmwf/ecmwf-vault"
urls.Issues = "https://github.com/ecmwf/ecmwf-vault/issues"
urls.Repository = "https://github.com/ecmwf/ecmwf-vault"
# The installed commands. The library itself is imported, not run; the modules behind the
# scripts are private to ecmwf_vault.commands, so the commands are the artefacts and not APIs.
scripts.kubectl_vault = "ecmwf_vault.commands.kubectl_vault:main"
scripts.vault_cubby = "ecmwf_vault.commands.vault_cubby:main"
scripts.vault_expiry = "ecmwf_vault.commands.vault_expiry:main"
scripts.vault_login = "ecmwf_vault.commands.vault_login:main"
scripts.vaultenv = "ecmwf_vault.commands.vaultenv:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecmwf_vault = ["py.typed"]
